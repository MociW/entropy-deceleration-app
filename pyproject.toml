[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entropi"
version = "0.1.0"
description = "Research project categorizer with entropy classification"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "streamlit>=1.40",
    "pandas>=2.2",
    "plotly>=5.20",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "numpy>=2.0",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
entropi = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
